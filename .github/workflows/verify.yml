name: Linux alpha checks
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 9 * * 1'
permissions:
  contents: read
jobs:
  linux:
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --no-deps -r requirements.txt
      - name: Install Apache proxy test dependency
        run: sudo apt-get update && sudo apt-get install -y apache2-bin php-cli
      - run: bash scripts/verify.sh
      - uses: actions/setup-node@v4
        if: matrix.os == 'ubuntu-24.04'
        with:
          node-version: '22'
          cache: npm
      - name: Browser workflow checks
        if: matrix.os == 'ubuntu-24.04'
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always() && matrix.os == 'ubuntu-24.04'
        with:
          name: browser-results
          path: build/browser-results
      - name: Test root FPP socket access from an unprivileged runtime
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror tests/socket_permissions_test.cpp -o build/socket-permissions-test
          sudo build/socket-permissions-test
      - name: Compile against pinned FPP reference headers
        run: |
          sudo apt-get update
          sudo apt-get install -y libjsoncpp-dev
          git clone --no-checkout https://github.com/FalconChristmas/fpp.git .upstream/fpp
          git -C .upstream/fpp checkout $(python -c 'import json; print(json.load(open("upstream.lock.json"))["fpp"]["reference_commit"])')
          make SRCDIR=.upstream/fpp/src LINK_FPP=0 build/libFPP_WLED_10.x.so
          test -z "$(nm -D build/libFPP_WLED_10.x.so | awk '$2==\"u\"')"
      - name: Compile against latest released and nightly FPP headers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release=$(gh api repos/FalconChristmas/fpp/releases/latest --jq .tag_name)
          git -C .upstream/fpp fetch --depth 1 origin "refs/tags/$release:refs/tags/$release" refs/heads/master:refs/remotes/origin/compat-nightly
          git -C .upstream/fpp worktree add --detach ../fpp-release "refs/tags/$release"
          git -C .upstream/fpp worktree add --detach ../fpp-nightly refs/remotes/origin/compat-nightly
          for version in release nightly; do
            source_dir=".upstream/fpp-$version/src"
            make -B SRCDIR="$source_dir" LINK_FPP=0 build/libFPP_WLED_10.x.so
            test -z "$(nm -D build/libFPP_WLED_10.x.so | awk '$2==\"u\"')"
            printf '%s %s\n' "$version" "$(git -C ".upstream/fpp-$version" rev-parse HEAD)" >>build/fpp-header-compatibility.txt
          done
      - run: python scripts/benchmark.py --output build/benchmark.json
      - uses: actions/upload-artifact@v4
        with:
          name: verification-${{ matrix.os }}
          path: |
            build/benchmark.json
            build/fpp-header-compatibility.txt
