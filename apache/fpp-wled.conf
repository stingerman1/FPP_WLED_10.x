# Plugin-owned configuration; stock FPP files and listeners are unchanged.
# This socket requires the same authentication as the TCP API. Never proxy
# control.sock, which is reserved for trusted FPP commands.
RedirectMatch 302 ^/fpp-wled$ /fpp-wled/
<Location "/fpp-wled/">
    ProxyPass "unix:/run/fpp-wled/web.sock|http://localhost/fpp-wled/" upgrade=websocket
    ProxyPassReverse "http://localhost/fpp-wled/"
</Location>
